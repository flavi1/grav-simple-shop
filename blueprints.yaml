name: Simple Shop
version: 1.0.0
description: "Une mini boutique en ligne"
icon: shopping-cart
author:
  name: Guillon Flavien
homepage: https://github.com/flavi1/grav-simple-shop
keywords: [stripe, checkout, payment, e-commerce]
bugs: https://github.com/flavi1/grav-simple-shop/issues
license: MIT

dependencies:
  - name: mvc
    version: '>=0.1.0'

form:
  validation: strict
  fields:
    enabled:
      type: toggle
      label: Status
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    newsletter_unsubscribe_secret:
      type: text
      label: Secret des liens de désabonnement newsletter
      help: "Utilisé pour signer (HMAC) les liens de désabonnement à la newsletter envoyés par e-mail, afin qu'ils restent valides sans session ni connexion préalable. Laissez vide pour utiliser automatiquement le salt système (system.security.salt) ou, à défaut, l'e-mail de l'auteur du site — recommandé de définir une valeur dédiée pour plus de robustesse."
      default: ''

    seller_email:
      type: email
      label: E-mail de notification des commandes (vendeur)
      help: "Adresse e-mail recevant une notification à chaque nouvelle commande (voir OrderMailer::sendSellerNotification()). Laissez vide pour utiliser automatiquement l'e-mail de l'auteur du site (site.author.email)."
      default: ''

    currency:
      type: text
      label: Devise
      help: "Code ISO 4217 (EUR, CHF…). Tous les montants de la boutique sont dans cette devise."
      default: EUR
      validate:
        pattern: '[A-Z]{3}'

    taxes_fieldset:
      type: fieldset
      title: Taxes
      help: "Comme WooCommerce : chaque type de produit a une CLASSE de taxe (ex. livres → Taux réduit), et chaque classe une liste de TAUX par pays (ou région, codes postaux). Valeurs par défaut : TVA française."
      fields:
        taxes.enabled:
          type: toggle
          label: Activer les taxes
          default: 1
          highlight: 1
          options: { 1: Oui, 0: Non }
          validate: { type: bool }
        taxes.prices_entered:
          type: select
          label: Les prix des fiches produit sont saisis
          help: "Changer ce réglage convertit une fois les fiches existantes (prix TTC inchangé). Une fiche peut avoir sa propre base (« Prix saisis »)."
          default: ht
          options:
            ht: Hors taxe (HT)
            ttc: Toutes taxes comprises (TTC)
        taxes.based_on:
          type: select
          label: Taux calculé d'après
          help: "Avant que le client ait saisi son adresse (fiche produit, panier), l'adresse de la boutique est utilisée."
          default: shipping
          options:
            shipping: "L'adresse de livraison du client"
            billing: "L'adresse de facturation du client"
            shop: "L'adresse de la boutique"
        taxes.shipping_tax:
          type: select
          label: Taxe des frais de livraison
          help: "En France, la livraison suit le taux des articles livrés ; pour un panier à plusieurs taux, la répartition au prorata est la pratique recommandée."
          default: items
          data-options@: '\Grav\Plugin\SimpleShop\Tax\TaxSettings::shippingOptions'
          options:
            items: 'Selon les articles du panier (panier mixte : taux le plus élevé)'
            items_prorata: Selon les articles du panier, au prorata du HT
        taxes.shop.country:
          type: text
          label: Pays de la boutique (code ISO à deux lettres)
          default: FR
          validate: { pattern: '[A-Za-z]{2}' }
        taxes.shop.postcode:
          type: text
          label: Code postal de la boutique
        taxes.default_class:
          type: select
          label: Classe de taxe par défaut
          help: "Pour un produit dont le type n'a pas de classe."
          default: standard
          data-options@: '\Grav\Plugin\SimpleShop\Tax\TaxSettings::classOptions'
          options: { standard: 'Taux normal', intermediaire: 'Taux intermédiaire', reduit: 'Taux réduit', particulier: 'Taux particulier', zero: 'Taux zéro', exonere: 'Exonéré' }
        taxes.small_business.enabled:
          type: toggle
          label: Franchise en base de TVA
          help: "Aucune TVA facturée ; la mention ci-dessous est imprimée sur les factures."
          default: 0
          highlight: 0
          options: { 1: Oui, 0: Non }
          validate: { type: bool }
        taxes.small_business.mention:
          type: text
          label: Mention de franchise
          default: 'TVA non applicable, art. 293 B du CGI'
        taxes.classes:
          type: list
          label: Classes de taxe
          help: "Code (lettres, chiffres, tiret) et libellé. Les commandes passées gardent leur taxe."
          style: vertical
          fields:
            .code:
              type: text
              label: Code
              placeholder: reduit
              validate: { required: true, pattern: '[A-Za-z0-9_-]{1,40}' }
            .label:
              type: text
              label: Libellé
              placeholder: Taux réduit
        taxes.rates:
          type: list
          label: Taux
          help: "Pour une classe et une adresse, on retient à chaque priorité la ligne la plus précise (code postal, puis région, puis pays, puis « tous ») ; plusieurs priorités = plusieurs taxes cumulées."
          style: vertical
          fields:
            .class:
              type: select
              label: Classe
              data-options@: '\Grav\Plugin\SimpleShop\Tax\TaxSettings::classOptions'
              options: { standard: 'Taux normal', intermediaire: 'Taux intermédiaire', reduit: 'Taux réduit', particulier: 'Taux particulier', zero: 'Taux zéro', exonere: 'Exonéré' }
            .country:
              type: text
              label: Pays (vide = tous)
              placeholder: FR
            .region:
              type: text
              label: Région (code, facultatif)
            .postcodes:
              type: text
              label: Codes postaux (facultatif)
              help: "Séparés par « ; ». « 20* » = commence par 20 ; « 97100...97199 » = intervalle."
            .rate:
              type: text
              label: Taux (%)
              placeholder: '5.5'
              validate: { required: true, pattern: '[0-9]+([.,][0-9]{1,4})?' }
            .name:
              type: text
              label: Nom (affiché et sur la facture)
              placeholder: TVA 5,5 %
            .priority:
              type: number
              label: Priorité
              default: 1
              validate: { min: 1 }
            .compound:
              type: toggle
              label: Composée (calculée sur le prix déjà taxé)
              default: 0
              highlight: 0
              options: { 1: Oui, 0: Non }
              validate: { type: bool }
            .shipping:
              type: toggle
              label: S'applique aux frais de livraison
              default: 1
              highlight: 1
              options: { 1: Oui, 0: Non }
              validate: { type: bool }
            .category:
              type: select
              label: Catégorie (facture électronique)
              default: S
              options:
                S: Taux normal ou réduit
                Z: Taux zéro
                E: 'Exonéré (mention obligatoire)'
                O: Hors champ de la TVA
            .mention:
              type: text
              label: Mention sur la facture (exonération)
              placeholder: 'TVA non applicable, art. 261-4-4°-a du CGI'
        taxes.types:
          type: list
          label: Classe de chaque type de produit
          help: "Remplace la classe déclarée dans le blueprint du type (ex. book → Taux réduit). Une fiche peut aussi avoir sa propre classe."
          style: vertical
          fields:
            .type:
              type: select
              label: Type de produit
              data-options@: '\Grav\Plugin\SimpleShop\Tax\TaxSettings::typeOptions'
            .class:
              type: select
              label: Classe de taxe
              data-options@: '\Grav\Plugin\SimpleShop\Tax\TaxSettings::classOptions'
              options: { standard: 'Taux normal', intermediaire: 'Taux intermédiaire', reduit: 'Taux réduit', particulier: 'Taux particulier', zero: 'Taux zéro', exonere: 'Exonéré' }

    delivery_fieldset:
      type: fieldset
      title: Livraison
      fields:
        delivery.allowed_zones:
          type: selectize
          label: Zones desservies
          help: "FR-METRO = France métropolitaine hors Corse. Chaque zone ouverte doit avoir des règles de tarif."
          default: [FR-METRO]
          selectize:
            create: false
            options:
              - { value: FR-METRO, text: 'France métropolitaine (hors Corse)' }
              - { value: FR-CORSE, text: 'Corse' }
              - { value: FR-OM, text: 'Outre-mer' }
              - { value: EU-ZONE-1, text: 'Union européenne (zone 1)' }
              - { value: INTERNATIONAL, text: 'International' }
        delivery.unsupported_message:
          type: textarea
          label: Message si la destination n'est pas desservie
          help: "Laissez vide pour le message par défaut."
        delivery.prices_entered:
          type: select
          label: "Prix de carriers.yaml"
          help: "Hors taxe : la TVA du site est ajoutée automatiquement, avant les contraintes globales (Boutique > Transporteurs)."
          default: ht
          options: { ht: "Hors taxe (HT)", ttc: "Toutes taxes comprises (TTC)" }
        delivery.packaging.weight:
          type: number
          label: "Poids de l'emballage par commande (g)"
          help: "Valeur de départ non vérifiée : à ajuster en pesant votre emballage habituel."
          default: 40
        delivery.packaging.thickness:
          type: number
          label: "Épaisseur de l'emballage par commande (mm)"
          default: 6
        delivery.geocoding.url:
          type: url
          label: "Service de géocodage (retrait sur place)"
          help: "Sert à mesurer la distance entre le client (sa commune seulement) et le lieu de retrait. Par défaut : service public de la Base Adresse Nationale (données ouvertes, sans clé). Un géocodeur compatible addok auto-hébergé peut le remplacer. https obligatoire."
          default: 'https://data.geopf.fr/geocodage/search'
        delivery.geocoding.timeout:
          type: number
          label: "Délai maximal du géocodage (s)"
          default: 4
          validate: { min: 1, max: 20 }

    invoicing_fieldset:
      type: fieldset
      title: Facturation électronique (Factur-X / e-reporting)
      help: "Voir CDC-E-REPORTING.md pour le détail de la réforme et des statuts e-reporting."
      fields:
        date_b2c_begin:
          type: date
          label: Date de début de l'obligation e-reporting B2C
          help: "Avant cette date, les factures B2C sont marquées « Désactivée » (statut desactive du CDC). Valeur réglementaire actuelle pour les petites entreprises : 2027-09-01."
          default: '2027-09-01'

        seller.name:
          type: text
          label: Raison sociale (vendeur)
          help: "Nom légal de l'émetteur des factures."

        seller.address_line1:
          type: text
          label: Adresse (ligne 1)

        seller.address_line2:
          type: text
          label: Adresse (ligne 2)

        seller.postal_code:
          type: text
          label: Code postal

        seller.city:
          type: text
          label: Ville

        seller.country:
          type: text
          label: Pays (code ISO)
          default: FR

        seller.siret:
          type: text
          label: SIRET (ou SIREN)
          help: "14 chiffres (ou les 9 du SIREN). Le SIREN identifie le vendeur dans la facture électronique."
          validate:
            pattern: '[0-9 ]{9,17}'

        seller.vat_number:
          type: text
          label: Numéro de TVA intracommunautaire
          help: "Ex. FR12345678901. Obligatoire sur une facture avec TVA (règle EN 16931 BR-S-02)."

        invoicing.billing_mode:
          type: select
          label: Cadre de facturation (facture électronique)
          default: B2
          options:
            B2: "B2 — livraison de biens, facture déjà payée"
            S2: "S2 — prestations de services, facture déjà payée"
            M2: "M2 — biens et services, facture déjà payée"

        invoicing.notes.AAB:
          type: text
          label: Mention escompte
          default: "Pas d'escompte pour paiement anticipé."

        invoicing.notes.PMD:
          type: text
          label: Mention pénalités de retard
          default: "Facture payée à la commande : pas de pénalités de retard."

        invoicing.notes.PMT:
          type: text
          label: Mention frais de recouvrement
          default: "Facture payée à la commande : pas d'indemnité forfaitaire pour frais de recouvrement."
