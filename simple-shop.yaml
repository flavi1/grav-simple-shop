enabled: true
# Anti-spam des codes de connexion (OTP), vérifié côté serveur
otp:
  resend_delay: 60        # secondes entre deux envois pour une même session
  max_per_email_hour: 5   # envois par heure vers une même adresse e-mail
  max_per_ip_hour: 20     # envois par heure depuis une même adresse IP
routes:
  cart: '/cart'
  validation: '/checkout/email'
  delivery: '/checkout/delivery'
  payment: '/checkout/payment'
  payment_return: '/checkout/payment-return'
  confirmation: '/checkout/confirmation'
  identify: '/identify'
  account: '/mon-compte'
  logout: '/mon-compte/deconnexion'
  newsletter_unsubscribe: '/newsletter/unsubscribe'

# Livraison : zones desservies par CE site (le plugin sait résoudre FR-METRO,
# FR-CORSE, FR-OM, EU-ZONE-1 et INTERNATIONAL ; chaque zone ouverte doit avoir
# des règles dans carriers.yaml). Message personnalisable si la zone est refusée.
delivery:
  allowed_zones:
    - FR-METRO
  unsupported_message: ''
  # Les prix de carriers.yaml sont saisis hors taxe (`ht`, la TVA du site est ajoutée) ou toutes taxes comprises (`ttc`).
  prices_entered: ht
  # Lien de suivi du colis envoyé au client ({number} = numéro de suivi ; https obligatoire). Valable pour Colissimo et la lettre suivie.
  tracking_url: 'https://www.laposte.fr/outils/suivre-vos-envois?code={number}'
  # Emballage ajouté à chaque commande pour choisir le transporteur (valeurs de départ, à ajuster par pesée).
  packaging:
    weight: 40            # grammes
    thickness: 6          # millimètres
  # Lois et offres sur le prix de livraison (ex. plancher des frais de livraison de livres) : « contraintes globales »,
  # bloc `constraints` de carriers.yaml, réglées dans Admin2 > Boutique > Transporteurs.
  # Géocodage (retrait sur place : distance client ↔ lieu de retrait). Service public de la Base Adresse Nationale
  # (Géoplateforme IGN, données ouvertes, sans clé) ; tout service compatible addok peut le remplacer (https obligatoire).
  geocoding:
    url: 'https://data.geopf.fr/geocodage/search'
    timeout: 4            # secondes

# Devise du site (code ISO 4217). Tous les montants (produits, livraison, commandes) sont dans cette devise.
currency: EUR

# Taxes (modèle de WooCommerce, voir README et classes/Tax/) : des CLASSES de taxe attachées aux types de produits,
# et une TABLE DES TAUX par classe (pays / région / codes postaux, taux, priorité, composée, livraison, catégorie de facture).
# Valeurs par défaut : TVA française ; les livres sont en classe « reduit » (5,5 %, blueprint du thème).
taxes:
  enabled: true
  prices_entered: ht      # ht | ttc : base de saisie des prix des fiches (surchargeable par fiche : price_entered_as)
  based_on: shipping      # adresse qui décide du taux : shipping (livraison) | billing (facturation) | shop (boutique)
  # Taxe des frais de livraison : items = selon les articles du panier (panier mixte : taux le plus élevé, comme WooCommerce),
  # items_prorata = réparti au prorata du HT des articles (pratique française recommandée), ou un code de classe fixe.
  shipping_tax: items
  shop:                   # adresse de la boutique (taux avant la saisie de l'adresse du client)
    country: FR
    region: ''
    postcode: ''
  default_class: standard
  small_business:         # franchise en base : aucune TVA facturée, mention obligatoire
    enabled: false
    mention: 'TVA non applicable, art. 293 B du CGI'
  classes:
    - { code: standard, label: 'Taux normal' }
    - { code: intermediaire, label: 'Taux intermédiaire' }
    - { code: reduit, label: 'Taux réduit' }
    - { code: particulier, label: 'Taux particulier' }
    - { code: zero, label: 'Taux zéro' }
    - { code: exonere, label: 'Exonéré' }
  rates:
    - { class: standard, country: FR, region: '', postcodes: '', rate: 20, name: 'TVA 20 %', priority: 1, compound: false, shipping: true, category: S, mention: '' }
    - { class: intermediaire, country: FR, region: '', postcodes: '', rate: 10, name: 'TVA 10 %', priority: 1, compound: false, shipping: true, category: S, mention: '' }
    - { class: reduit, country: FR, region: '', postcodes: '', rate: 5.5, name: 'TVA 5,5 %', priority: 1, compound: false, shipping: true, category: S, mention: '' }
    - { class: particulier, country: FR, region: '', postcodes: '', rate: 2.1, name: 'TVA 2,1 %', priority: 1, compound: false, shipping: true, category: S, mention: '' }
    - { class: zero, country: FR, region: '', postcodes: '', rate: 0, name: 'TVA 0 %', priority: 1, compound: false, shipping: true, category: Z, mention: '' }
    - { class: exonere, country: FR, region: '', postcodes: '', rate: 0, name: 'Exonéré', priority: 1, compound: false, shipping: true, category: E, mention: 'TVA non applicable' }
  types: []               # type de produit → classe, surcharge du blueprint : [{ type: book, class: reduit }]

# E-mail au client quand sa commande passe à l'un de ces statuts (voir OrderManager::STATUSES)
status_emails:
  - shipped
  - cancelled
  - refunded

# Facturation électronique Factur-X / e-reporting (voir CDC-E-REPORTING.md et
# classes/Invoicing/InvoiceManager.php).
# (l'ancienne clé `vat_rate` est remplacée par `taxes`)
date_b2c_begin: '2027-09-01'
seller:
  name: ''
  address_line1: ''
  address_line2: ''
  postal_code: ''
  city: ''
  country: 'FR'
  siret: ''
  vat_number: ''
# Mentions des factures électroniques (règles françaises BR-FR, réforme 2026-2027).
invoicing:
  # Cadre de facturation (BT-23) : B2 = livraison de biens, facture déjà payée (vente en ligne payée à la commande).
  # S2 = prestations de services déjà payées, M2 = mixte déjà payée.
  billing_mode: B2
  # Mentions obligatoires (BT-22, notes de la facture) : escompte, pénalités de retard, frais de recouvrement.
  notes:
    AAB: "Pas d'escompte pour paiement anticipé."
    PMD: "Facture payée à la commande : pas de pénalités de retard."
    PMT: "Facture payée à la commande : pas d'indemnité forfaitaire pour frais de recouvrement."
